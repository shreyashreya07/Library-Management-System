{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SmartLibrary{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold" href="/">
                SmartLibrary
            </a>

            <!-- Navbar Links -->
            <div class="ms-auto">

                <ul class="navbar-nav flex-row gap-3">

                    <li class="nav-item">
                        <a class="nav-link text-white" href="/">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="/books/">
                            Books
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/add-book/">
                             Add Book
                        </a>
                    </li>
                    <li class="nav-item">
    <a class="nav-link text-white" href="/issue-book/">
        Issue Book
    </a>
</li>
<li class="nav-item">
    <a class="nav-link text-white" href="/issued-books/">
        Issued Books
    </a>
</li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        {% block content %}
        {% endblock %}

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
