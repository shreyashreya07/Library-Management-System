{% extends 'base.html' %}

{% block title %}Issue Book{% endblock %}

{% block content %}

<style>

    body{
        background: #020617;
        font-family: 'Poppins', sans-serif;
    }

    .issue-container{
        min-height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .issue-card{
        width: 100%;
        max-width: 760px;
        background: rgba(15,23,42,0.96);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 30px;
        padding: 45px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(34,197,94,0.18);
    }

    .issue-card::before{
        content: "";
        position: absolute;
        width: 260px;
        height: 260px;
        background: rgba(34,197,94,0.12);
        border-radius: 50%;
        top: -120px;
        right: -100px;
    }

    .top-badge{
        display: inline-block;
        background: rgba(34,197,94,0.15);
        color: #4ade80;
        padding: 8px 18px;
        border-radius: 50px;
        margin-bottom: 18px;
        font-size: 14px;
        font-weight: 500;
    }

    .page-title{
        color: white;
        font-size: 38px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .page-subtitle{
        color: #94a3b8;
        font-size: 16px;
        margin-bottom: 35px;
    }

    form p{
        margin-bottom: 24px;
    }

    form label{
        color: #cbd5e1;
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 10px;
        display: block;
    }

    form input,
    form select,
    form textarea{
        width: 100%;
        background: #0f172a;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        height: 56px;
        padding: 15px;
        color: white;
        outline: none;
        transition: 0.3s ease;
    }

    form textarea{
        height: 120px;
    }

    form input:focus,
    form select:focus,
    form textarea:focus{
        border-color: #22c55e;
        box-shadow: 0 0 18px rgba(34,197,94,0.4);
    }

    .issue-btn{
        width: 100%;
        height: 58px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(90deg,#22c55e,#16a34a);
        color: white;
        font-size: 17px;
        font-weight: 600;
        margin-top: 15px;
        transition: 0.3s ease;
    }

    .issue-btn:hover{
        transform: translateY(-3px);
        box-shadow: 0 0 25px rgba(34,197,94,0.5);
    }

    @media(max-width: 768px){

        .issue-card{
            padding: 30px 22px;
        }

        .page-title{
            font-size: 30px;
        }
    }

</style>

<div class="issue-container">

    <div class="issue-card">

        <div class="top-badge">
            📖 SmartLibrary Issue Center
        </div>

        <h1 class="page-title">
            Issue Book
        </h1>

        <p class="page-subtitle">
            Assign books to students and manage issue records efficiently
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="issue-btn">
                Issue Book
            </button>

        </form>

    </div>

</div>

{% endblock %}
