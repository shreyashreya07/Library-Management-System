{% extends 'base.html' %}

{% block title %}Add Book{% endblock %}

{% block content %}

<style>

    body{
        background: #020617;
        font-family: 'Poppins', sans-serif;
    }

    .add-book-container{
        min-height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .tech-card{
        width: 100%;
        max-width: 750px;
        background: rgba(15,23,42,0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 28px;
        padding: 45px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 35px rgba(59,130,246,0.18);
    }

    .tech-card::before{
        content: "";
        position: absolute;
        width: 250px;
        height: 250px;
        background: rgba(59,130,246,0.12);
        border-radius: 50%;
        top: -100px;
        right: -100px;
    }

    .page-title{
        color: white;
        font-size: 38px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .page-subtitle{
        color: #94a3b8;
        margin-bottom: 35px;
        font-size: 16px;
    }

    form p{
        margin-bottom: 25px;
    }

    form label{
        color: #cbd5e1;
        font-weight: 500;
        margin-bottom: 10px;
        display: block;
    }

    form input,
    form select,
    form textarea{
        width: 100%;
        background: #0f172a;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        height: 55px;
        padding: 15px;
        color: white;
        outline: none;
        transition: 0.3s ease;
    }

    form textarea{
        height: 120px;
    }

    form input:focus,
    form select:focus,
    form textarea:focus{
        border-color: #3b82f6;
        box-shadow: 0 0 15px rgba(59,130,246,0.4);
    }

    .submit-btn{
        width: 100%;
        height: 58px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(90deg,#3b82f6,#06b6d4);
        color: white;
        font-size: 17px;
        font-weight: 600;
        margin-top: 15px;
        transition: 0.3s ease;
    }

    .submit-btn:hover{
        transform: translateY(-3px);
        box-shadow: 0 0 25px rgba(59,130,246,0.5);
    }

    @media(max-width: 768px){

        .tech-card{
            padding: 30px 22px;
        }

        .page-title{
            font-size: 30px;
        }
    }

</style>

<div class="add-book-container">

    <div class="tech-card">

        <h1 class="page-title">
            Add New Book
        </h1>

        <p class="page-subtitle">
            Enter book details to add them into SmartLibrary
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-btn">
                Add Book
            </button>

        </form>

    </div>

</div>

{% endblock %}
